<main
  class="grid min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-sky-800 lg:grid-cols-[1.05fr_.95fr]"
>
  <section class="relative hidden overflow-hidden lg:block">
    <img
      src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=85"
      alt="Viajera contemplando un paisaje de montañas"
      class="absolute inset-0 size-full object-cover"
    />
    <div
      class="absolute inset-0 bg-gradient-to-t from-blue-950 via-blue-950/30 to-blue-950/10"
    ></div>
    <div class="relative flex h-full flex-col justify-between p-10 xl:p-16">
      <a routerLink="/" class="inline-flex w-fit items-center gap-3 text-white"
        ><img src="assets/logo.png" alt="" class="size-11" /><span
          class="font-display text-2xl font-bold"
          >ViajeDirecto</span
        ></a
      >
      <blockquote class="max-w-xl text-white">
        <p class="font-display text-4xl font-semibold leading-tight text-balance xl:text-5xl">
          “Cuidamos la ruta para que tu equipo pueda cuidar la experiencia.”
        </p>
        <footer class="mt-6 text-sm text-blue-100/70">Panel de gestión · ViajeDirecto</footer>
      </blockquote>
    </div>
  </section>
  <section
    class="relative flex min-w-0 items-center justify-center overflow-hidden bg-[#f4f6f0] px-4 py-10 sm:px-8"
  >
    <div class="absolute -right-24 -top-24 size-72 rounded-full bg-amber-200/35 blur-3xl"></div>
    <div class="absolute -bottom-24 -left-24 size-72 rounded-full bg-blue-200/40 blur-3xl"></div>
    <div class="relative w-full max-w-md">
      <a routerLink="/" class="mb-8 flex items-center justify-center gap-2.5 lg:hidden"
        ><img src="assets/logo.png" alt="" class="size-10" /><span
          class="font-display text-2xl font-bold text-blue-950"
          >ViajeDirecto</span
        ></a
      >
      <router-outlet />
      <a
        routerLink="/"
        class="mt-6 flex items-center justify-center gap-2 text-sm font-semibold text-blue-800 hover:text-blue-600"
        >← Volver al sitio público</a
      >
    </div>
  </section>
</main>
