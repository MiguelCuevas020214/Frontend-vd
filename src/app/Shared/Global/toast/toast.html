@if (visible()) {
  <div
    class="pointer-events-none fixed inset-x-3 top-3 z-[1000000] flex justify-center sm:inset-x-auto sm:right-5 sm:top-5"
    aria-live="polite"
    aria-atomic="true"
  >
    <div
      class="toast pointer-events-auto flex w-full max-w-md items-start gap-3 rounded-2xl border bg-white p-4 shadow-2xl shadow-slate-950/20"
      [class.leaving]="leaving()"
      [class]="
        type === 'success'
          ? 'border-green-200'
          : type === 'error'
            ? 'border-rose-200'
            : type === 'warning'
              ? 'border-amber-200'
              : 'border-sky-200'
      "
      role="status"
    >
      <span
        class="grid size-8 shrink-0 place-items-center rounded-full text-sm font-bold"
        [class]="
          type === 'success'
            ? 'bg-green-100 text-green-700'
            : type === 'error'
              ? 'bg-rose-100 text-rose-700'
              : type === 'warning'
                ? 'bg-amber-100 text-amber-700'
                : 'bg-sky-100 text-sky-700'
        "
        aria-hidden="true"
        >{{ icon }}</span
      >
      <p class="min-w-0 flex-1 pt-1 text-sm font-medium leading-relaxed text-slate-700">
        {{ message }}
      </p>
      <button
        type="button"
        class="grid size-7 shrink-0 cursor-pointer place-items-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-800"
        (click)="dismiss()"
        aria-label="Cerrar notificación"
      >
        ×
      </button>
    </div>
  </div>
}
