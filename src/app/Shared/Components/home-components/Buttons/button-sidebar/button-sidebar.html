<button
  type="button"
  class="group flex min-h-11 w-full cursor-pointer items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-sm font-medium transition-all active:scale-[0.98]"
  [class.bg-white/10]="active"
  [class.text-white]="active"
  [class.text-blue-100/70]="!active"
  [class.hover:bg-white/5]="!active"
  [class.hover:text-white]="!active"
  [disabled]="disabled"
  (click)="btnClick.emit($event)"
>
  <span
    class="grid size-8 shrink-0 place-items-center rounded-lg"
    [class.bg-amber-300]="active"
    [class.text-blue-950]="active"
    [class.bg-white/5]="!active"
    aria-hidden="true"
    >{{ icon }}</span
  >
  <span class="truncate">{{ label }}</span>
  @if (active) {
    <span class="ml-auto size-1.5 rounded-full bg-amber-300"></span>
  }
</button>
