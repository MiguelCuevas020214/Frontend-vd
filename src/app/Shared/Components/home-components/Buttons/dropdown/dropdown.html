<div class="relative inline-block" (appClickOutside)="isOpen = false">
  <button
    type="button"
    class="grid size-10 cursor-pointer place-items-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
    [attr.aria-label]="label"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen"
    (click)="isOpen = !isOpen"
  >
    <span class="text-xl leading-none" aria-hidden="true">•••</span>
  </button>
  @if (isOpen) {
    <div
      class="absolute right-0 top-11 z-50 min-w-44 overflow-hidden rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl shadow-slate-900/10"
      role="menu"
    >
      @for (item of items; track item.id) {
        <button
          type="button"
          role="menuitem"
          class="block w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50"
          [class.text-rose-600]="item.danger"
          (click)="select(item)"
        >
          {{ item.label }}
        </button>
      }
    </div>
  }
</div>
