<app-button
  type="submit"
  [label]="loading ? 'Guardando…' : label"
  [disabled]="disabled || loading"
  [fullWidth]="fullWidth"
  (btnClick)="saveClick.emit($event)"
>
  @if (loading) {
    <span
      class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
      aria-hidden="true"
    ></span>
  }
</app-button>
