<span
  class="inline-flex max-w-full items-center rounded-full border text-xs font-semibold transition"
  [class]="
    active
      ? 'border-blue-800 bg-blue-900 text-white'
      : 'border-slate-200 bg-white text-slate-600 hover:border-blue-500 hover:text-blue-800'
  "
>
  <button
    type="button"
    class="min-h-8 cursor-pointer rounded-full px-3 py-1.5"
    (click)="chipClick.emit()"
  >
    {{ label }}
  </button>
  @if (removable) {
    <button
      type="button"
      class="mr-2 grid size-5 cursor-pointer place-items-center rounded-full hover:bg-black/10"
      (click)="remove.emit()"
      [attr.aria-label]="'Quitar filtro ' + label"
    >
      ×
    </button>
  }
</span>
