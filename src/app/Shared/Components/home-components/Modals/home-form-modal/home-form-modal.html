<app-modal
  title="Editar contenido del home"
  subtitle="Actualiza la portada y selecciona las experiencias destacadas."
  maxWidth="max-w-4xl"
  [closeOnBackdrop]="false"
  (onClose)="cancelled.emit()"
>
  <form (submit)="$event.preventDefault()" (ngSubmit)="save()">
    @if (error()) {
      <div class="mb-5 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">
        {{ error() }}
      </div>
    }
    <section class="overflow-hidden rounded-2xl border border-slate-200">
      <button
        type="button"
        class="flex w-full cursor-pointer items-center justify-between bg-slate-50 px-4 py-3 text-sm font-bold text-blue-950"
        (click)="heroOpen = !heroOpen"
      >
        <span>Portada principal</span><span>{{ heroOpen ? '−' : '+' }}</span>
      </button>
      @if (heroOpen) {
        <div class="grid gap-5 p-4 sm:p-5">
          <div class="grid gap-4 lg:grid-cols-2">
            <app-image-input
              label="Imagen principal del hero"
              [preview]="form.heroImage"
              (imageChange)="setHeroImage($event)"
            />
            <div class="space-y-4">
              <app-input-field
                label="Texto del botón principal"
                [ngModel]="form.primaryCta"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="form.primaryCta = $event === null ? '' : $event.toString()"
              /><app-input-field
                label="Texto del botón secundario"
                [ngModel]="form.secondaryCta"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="form.secondaryCta = $event === null ? '' : $event.toString()"
              />
              <div>
                <label for="hero-gallery" class="mb-1.5 block text-sm font-semibold text-slate-700"
                  >Otras imágenes del carrusel (una ruta por línea)</label
                ><textarea
                  id="hero-gallery"
                  name="heroImages"
                  [(ngModel)]="heroImagesText"
                  class="form-textarea min-h-24"
                  placeholder="/assets/portada/semana-santa.png"
                ></textarea>
                <p class="mt-1 text-xs text-slate-400">
                  La imagen principal es la primera del carrusel. Las demás rotan cada 5 segundos.
                </p>
              </div>
            </div>
          </div>
          <div>
            <label for="home-title" class="mb-1.5 block text-sm font-semibold text-slate-700"
              >Título principal</label
            ><textarea
              id="home-title"
              name="heroTitle"
              [(ngModel)]="form.heroTitle"
              class="form-textarea min-h-20"
            ></textarea>
          </div>
          <div>
            <label for="home-subtitle" class="mb-1.5 block text-sm font-semibold text-slate-700"
              >Subtítulo</label
            ><textarea
              id="home-subtitle"
              name="heroSubtitle"
              [(ngModel)]="form.heroSubtitle"
              class="form-textarea min-h-20"
            ></textarea>
          </div>
          <app-input-field
            label="Título de la presentación de la agencia"
            [ngModel]="form.aboutTitle"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="form.aboutTitle = $event === null ? '' : $event.toString()"
          />
          <div>
            <label for="home-about" class="mb-1.5 block text-sm font-semibold text-slate-700"
              >Texto de presentación</label
            ><textarea
              id="home-about"
              name="aboutText"
              [(ngModel)]="form.aboutText"
              class="form-textarea"
            ></textarea>
          </div>
        </div>
      }
    </section>
    <section class="mt-4 overflow-hidden rounded-2xl border border-slate-200">
      <button
        type="button"
        class="flex w-full cursor-pointer items-center justify-between bg-slate-50 px-4 py-3 text-sm font-bold text-blue-950"
        (click)="featuredOpen = !featuredOpen"
      >
        <span>Tours destacados del home</span><span>{{ featuredOpen ? '−' : '+' }}</span>
      </button>
      @if (featuredOpen) {
        <div class="p-4 sm:p-5">
          <p class="mb-3 text-xs text-slate-500">
            Elige los tours que aparecerán en la sección destacada del home.
          </p>
          <div class="grid gap-2 sm:grid-cols-2">
            @for (tour of tours; track tour.id) {
              <label
                class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-100 p-3 hover:bg-blue-50"
                ><input
                  type="checkbox"
                  [checked]="form.featuredTourIds.includes(tour.id)"
                  (change)="toggleFeatured(tour.id)"
                  class="mt-0.5 size-4 accent-blue-800"
                /><span class="text-xs font-semibold text-slate-700"
                  >{{ tour.name
                  }}<span class="mt-0.5 block font-normal text-slate-400">{{
                    tour.destination
                  }}</span></span
                ></label
              >
            }
          </div>
        </div>
      }
    </section>
    <footer
      class="sticky bottom-0 -mx-5 mt-6 flex justify-end gap-3 border-t border-slate-100 bg-white px-5 py-4 sm:-mx-6 sm:px-6"
    >
      <app-button
        variant="outline"
        label="Cancelar"
        [disabled]="saving()"
        (btnClick)="cancelled.emit()"
      /><app-save-button [loading]="saving()" label="Guardar contenido" />
    </footer>
  </form>
</app-modal>
