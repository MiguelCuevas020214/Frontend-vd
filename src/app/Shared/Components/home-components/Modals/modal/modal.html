<div
  class="modal-overlay fixed inset-0 z-[99999] flex items-center justify-center overflow-y-auto bg-slate-950/65 p-3 backdrop-blur-sm sm:p-6 {{
    overlayClass
  }}"
  (click)="onBackdropClick($event)"
>
  <section
    class="modal-panel relative flex w-full min-w-0 flex-col overflow-hidden rounded-2xl bg-white shadow-2xl shadow-slate-950/30 {{
      maxWidth
    }} {{ maxHeight }}"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title || 'Ventana de diálogo'"
  >
    @if (showHeader) {
      <header
        class="flex shrink-0 items-start justify-between gap-4 border-b border-slate-100 px-5 py-4 sm:px-6 sm:py-5"
      >
        <div class="min-w-0">
          <h2 class="font-display text-xl font-bold text-slate-950 sm:text-2xl">{{ title }}</h2>
          @if (subtitle) {
            <p class="mt-1 text-sm text-slate-500">{{ subtitle }}</p>
          }
        </div>
        @if (showCloseButton) {
          <button
            type="button"
            class="grid size-9 shrink-0 cursor-pointer place-items-center rounded-full text-xl text-slate-400 transition hover:bg-slate-100 hover:text-slate-900"
            (click)="requestClose()"
            aria-label="Cerrar ventana"
          >
            ×
          </button>
        }
      </header>
    } @else if (showCloseButton) {
      <button
        type="button"
        class="absolute right-4 top-4 z-10 grid size-9 cursor-pointer place-items-center rounded-full bg-white/90 text-xl text-slate-500 shadow-sm"
        (click)="requestClose()"
        aria-label="Cerrar ventana"
      >
        ×
      </button>
    }
    <div class="min-h-0 flex-1 overflow-y-auto {{ bodyClass }}"><ng-content /></div>
  </section>
</div>
