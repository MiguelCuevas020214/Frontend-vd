<app-modal
  [title]="title"
  maxWidth="max-w-md"
  overlayClass="z-[999999]"
  [showHeader]="false"
  [showCloseButton]="false"
  bodyClass="p-6 sm:p-7"
  [closeOnBackdrop]="false"
  (onClose)="cancelled.emit()"
>
  <div class="text-center">
    <div
      class="mx-auto grid size-14 place-items-center rounded-full text-2xl font-bold"
      [class]="
        theme === 'danger'
          ? 'bg-rose-50 text-rose-600'
          : theme === 'success'
            ? 'bg-blue-50 text-blue-700'
            : 'bg-sky-50 text-sky-700'
      "
      aria-hidden="true"
    >
      {{ icon }}
    </div>
    <h2 class="mt-4 font-display text-2xl font-bold text-slate-950">{{ title }}</h2>
    <p class="mt-2 text-sm leading-relaxed text-slate-600">{{ message }}</p>
    <div class="mt-6 grid grid-cols-2 gap-3">
      <app-button
        variant="outline"
        [label]="cancelText"
        [disabled]="loading"
        [fullWidth]="true"
        (btnClick)="cancelled.emit()"
      />
      <app-button
        [variant]="theme === 'danger' ? 'danger' : 'primary'"
        [label]="loading ? 'Procesando…' : confirmText"
        [disabled]="loading"
        [fullWidth]="true"
        (btnClick)="confirmed.emit()"
      />
    </div>
  </div>
</app-modal>
