<div>
  <span class="mb-1.5 block text-sm font-semibold text-slate-700"
    >{{ label }}
    @if (required) {
      <span class="text-rose-500">*</span>
    }
  </span>
  <div
    class="relative grid min-h-44 place-items-center overflow-hidden rounded-2xl border-2 border-dashed bg-slate-50 text-center transition"
    [class]="
      dragging
        ? 'border-blue-500 bg-blue-50'
        : error
          ? 'border-rose-400 bg-rose-50'
          : 'border-slate-200 hover:border-blue-400'
    "
    (dragover)="onDragOver($event)"
    (dragleave)="dragging = false"
    (drop)="onDrop($event)"
  >
    @if (preview) {
      <img
        [src]="preview"
        alt="Vista previa de la imagen seleccionada"
        class="absolute inset-0 size-full object-cover"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 to-transparent"></div>
      <div class="absolute bottom-3 left-3 right-3 flex justify-center gap-2">
        <button
          type="button"
          class="cursor-pointer rounded-full bg-white px-4 py-2 text-xs font-semibold text-slate-800"
          (click)="fileInput.click()"
        >
          Cambiar
        </button>
        <button
          type="button"
          class="cursor-pointer rounded-full bg-rose-600 px-4 py-2 text-xs font-semibold text-white"
          (click)="clear()"
          aria-label="Quitar imagen"
        >
          Quitar
        </button>
      </div>
    } @else {
      <button
        type="button"
        class="flex size-full min-h-44 cursor-pointer flex-col items-center justify-center gap-2 p-5"
        (click)="fileInput.click()"
      >
        <span
          class="grid size-11 place-items-center rounded-full bg-white text-xl text-blue-800 shadow-sm"
          aria-hidden="true"
          >↥</span
        >
        <span class="text-sm font-semibold text-slate-700">Arrastra una imagen o haz clic</span>
        <span class="text-xs text-slate-500">JPG, PNG o WebP · máximo 5 MB</span>
      </button>
    }
    <input
      #fileInput
      [id]="inputId"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      class="sr-only"
      (change)="onFileSelected($event)"
      [attr.aria-label]="label"
    />
  </div>
  @if (error) {
    <p class="mt-1.5 text-xs font-medium text-rose-600" role="alert">{{ error }}</p>
  }
</div>
