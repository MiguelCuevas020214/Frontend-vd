<div>
  <label [for]="inputId" class="mb-1.5 block text-sm font-semibold text-slate-700">{{
    label
  }}</label>
  <div class="relative">
    <input
      [id]="inputId"
      [type]="visible ? 'text' : 'password'"
      [placeholder]="placeholder"
      [ngModel]="ngModel"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="update($event)"
      [attr.autocomplete]="autocomplete"
      [attr.aria-invalid]="!!error"
      class="min-h-12 w-full rounded-xl border bg-white px-3.5 py-3 pr-12 text-sm outline-none transition"
      [class]="
        error
          ? 'border-rose-400 bg-rose-50 ring-2 ring-rose-200'
          : 'border-slate-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-100'
      "
      required
    />
    <button
      type="button"
      class="absolute right-2 top-1/2 grid size-9 -translate-y-1/2 cursor-pointer place-items-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700"
      (click)="visible = !visible"
      [attr.aria-label]="visible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    >
      {{ visible ? '◉' : '◎' }}
    </button>
  </div>
  @if (error) {
    <p class="mt-1.5 text-xs font-medium text-rose-600" role="alert">{{ error }}</p>
  }
</div>
