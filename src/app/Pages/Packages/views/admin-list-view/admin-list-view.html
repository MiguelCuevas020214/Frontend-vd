<div class="mx-auto max-w-350">
  <section>
    <div class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="font-display text-xl font-bold text-blue-950">Paquetes turísticos</h2>
        <p class="mt-1 text-sm text-slate-500">Gestiona las rutas completas y sus fechas.</p>
      </div>
      <app-button label="Nuevo paquete" (btnClick)="openCreate()"><span>＋</span></app-button>
    </div>
    <div class="mb-4 rounded-2xl border border-slate-200 bg-white p-3">
      <app-search-input
        placeholder="Buscar por paquete o destino"
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
      />
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      emptyTitle="Aún no hay paquetes"
      emptyMessage="Crea una ruta completa para comenzar."
      ><app-button label="Crear paquete" variant="outline" (btnClick)="openCreate()" /><ng-template
        #rowActions
        let-row
        ><div class="flex justify-end gap-1">
          <button
            type="button"
            class="cursor-pointer rounded-lg px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100"
            (click)="detailPackage.set(rowPackage(row))"
          >
            Ver</button
          ><button
            type="button"
            class="cursor-pointer rounded-lg px-3 py-2 text-xs font-semibold text-sky-700 hover:bg-sky-50"
            (click)="openEdit(rowPackage(row))"
          >
            Editar</button
          ><button
            type="button"
            class="cursor-pointer rounded-lg px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50"
            (click)="deletePackage.set(rowPackage(row))"
          >
            Eliminar
          </button>
        </div></ng-template
      ></app-data-table
    >
  </section>
</div>
@if (formOpen()) {
  <app-package-form-modal
    [item]="selectedPackage()"
    (cancelled)="formOpen.set(false)"
    (saved)="onSaved()"
  />
}
@if (detailPackage(); as item) {
  <app-package-detail-modal
    [item]="item"
    (closed)="detailPackage.set(null)"
    (edit)="openEdit($event)"
  />
}
@if (deletePackage(); as item) {
  <app-confirm-modal
    title="¿Eliminar este paquete?"
    [message]="'Se eliminará “' + item.name + '”. Esta acción no se puede deshacer.'"
    confirmText="Sí, eliminar"
    [loading]="deleting()"
    (cancelled)="deletePackage.set(null)"
    (confirmed)="confirmDelete()"
  />
}
